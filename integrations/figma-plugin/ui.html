<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body{font:12px Inter,system-ui,sans-serif;margin:16px;color:#111827}textarea{width:100%;height:360px;box-sizing:border-box;font:11px ui-monospace,monospace;padding:10px}button,select{padding:8px 10px;margin-top:10px}button{font-weight:600}#status{margin-top:12px;white-space:pre-wrap}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}
</style>
</head>
<body>
<h2>Forge SiteDocument Sync</h2>
<p>Paste a Forge structural export from the SiteDocument control center. The plugin only changes nodes carrying Forge identities, unless you choose Replace.</p>
<textarea id="payload" placeholder='{"kind":"forge-site-document-figma-plugin",...}'></textarea>
<div class="row">
  <select id="mode"><option value="merge">Merge / update mapped nodes</option><option value="replace">Replace Forge-managed page contents</option></select>
  <button id="apply" class="grow">Apply to current Figma page</button>
</div>
<div id="status"></div>
<script>
const payload=document.getElementById("payload"),status=document.getElementById("status"),mode=document.getElementById("mode");
document.getElementById("apply").onclick=()=>{
  status.textContent="Validating…";
  let parsed;try{parsed=JSON.parse(payload.value);}catch{status.textContent="Invalid JSON.";return;}
  parent.postMessage({pluginMessage:{type:"IMPORT",payload:parsed,mode:mode.value}},"*");
};
onmessage=e=>{
  const msg=e.data.pluginMessage||{};
  if(msg.type==="DONE") status.textContent=`Applied ${msg.pages} page(s) from Forge revision ${msg.revision}.`;
  if(msg.type==="ERROR") status.textContent=`Error: ${msg.message}`;
};
</script>
</body>
</html>
