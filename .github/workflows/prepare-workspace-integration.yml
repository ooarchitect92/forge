name: Qualify workspace and editor integration
on:
  push:
    branches: [main]
    paths:
      - scripts/maintenance/prepare-workspace-integration.mjs
      - scripts/maintenance/workspace-integration.patch.json
      - .github/workflows/prepare-workspace-integration.yml
      - backend/package.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-integration:
    if: github.repository == 'ooarchitect92/forge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: forge_hardening
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:disposable_fixture_only@127.0.0.1:5432/forge_hardening
      FORGE_DISPOSABLE_TEST_DB: '1'
      NODE_ENV: test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Apply only exact reviewed source replacements
        run: |
          node scripts/maintenance/prepare-workspace-integration.mjs apply
          git diff --cached --check
      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci 2>&1 | tee "$RUNNER_TEMP/backend-install.log"
          npx --no-install prisma generate 2>&1 | tee "$RUNNER_TEMP/prisma-generate.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/backend-build.log"
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci 2>&1 | tee "$RUNNER_TEMP/frontend-install.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/frontend-build.log"
      - name: Execute hardening unit tests
        run: node --experimental-vm-modules --test tests/hardening/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/source-unit.tap"
      - name: Prepare disposable legacy schema and test actual workspace migration
        working-directory: backend
        run: |
          npx --no-install prisma db push
          node --test dist/tests/workspace-integration.test.js 2>&1 | tee "$RUNNER_TEMP/workspace-integration.tap"
      - name: Export validated blobs; never update a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/maintenance/prepare-workspace-integration.mjs export
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-integration-${{ github.sha }}
          path: |
            validated-workspace-integration.json
            ${{ runner.temp }}/backend-install.log
            ${{ runner.temp }}/frontend-install.log
            ${{ runner.temp }}/prisma-generate.log
            ${{ runner.temp }}/backend-build.log
            ${{ runner.temp }}/frontend-build.log
            ${{ runner.temp }}/source-unit.tap
            ${{ runner.temp }}/workspace-integration.tap
          if-no-files-found: ignore
          retention-days: 7
