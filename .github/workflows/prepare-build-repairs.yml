name: Validate hash-bound build repairs
on:
  push:
    branches: [main]
    paths:
      - scripts/maintenance/prepare-build-repairs.mjs
      - .github/workflows/prepare-build-repairs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'ooarchitect92/forge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://forge_build:unused@127.0.0.1:5432/forge_build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Prepare only the three reviewed, hash-matched source repairs
        run: |
          node scripts/maintenance/prepare-build-repairs.mjs apply
          git diff --cached --check
      - name: Install backend locked dependencies
        working-directory: backend
        run: npm ci
      - name: Generate and compile backend
        working-directory: backend
        run: |
          npx --no-install prisma generate
          npm run build
      - name: Install frontend locked dependencies and compile
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run hardening tests against repaired source
        run: node --experimental-vm-modules --test tests/hardening/*.test.mjs
      - name: Export validated blobs without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/maintenance/prepare-build-repairs.mjs export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-build-repairs-${{ github.sha }}
          path: validated-build-repairs.json
          retention-days: 7
