name: One-shot feature lockfile refresh

on:
  push:
    branches: [feature/design-platform-foundation-20261001]
    paths: [.github/workflows/refresh-feature-lockfile.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Regenerate only the frontend lockfile
        run: npm install --prefix frontend --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package manifest was not rewritten
        run: git diff --exit-code -- frontend/package.json
      - name: Verify the high-severity dependency gate
        run: npm audit --prefix frontend --audit-level high
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "forge-security-bot"
          git config user.email "forge-security-bot@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: refresh frontend lockfile for security override"
          git push origin "HEAD:${GITHUB_REF_NAME}"
